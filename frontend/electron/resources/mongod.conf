# MongoDB configuration for FinanceGPT desktop app
# This file is for reference only — the Electron sidecar manager starts mongod
# with equivalent CLI arguments.

storage:
  dbPath: ./mongodb-data
  journal:
    enabled: true

net:
  port: 27017
  bindIp: 127.0.0.1

security:
  authorization: disabled

# Quiet logging for desktop app
systemLog:
  verbosity: 0
  destination: file
  path: ./mongodb.log
  logAppend: true

# Disable unnecessary services for embedded use
setParameter:
  enableLocalhostAuthBypass: true

# No replication for desktop single-node
replication: false